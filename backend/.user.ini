; Configuration PHP pour augmenter les limites d'upload
; Ce fichier est compatible avec cPanel et surcharge les valeurs du php.ini global
; Les modifications prennent effet après quelques minutes ou après redémarrage du serveur
; 
; IMPORTANT: Ce fichier surcharge les valeurs du php.ini principal
; Pour modifier via cPanel: Home >> Software >> MultiPHP INI Editor
; Documentation: https://go.cpanel.net/EA4ModifyINI

; Limite de taille pour les fichiers uploadés (augmenté de 2M à 20M pour les images)
upload_max_filesize = 20M

; Limite de taille pour les données POST (doit être >= upload_max_filesize)
; Augmenté de 20M à 25M pour laisser une marge
post_max_size = 25M

; Limite de mémoire (augmenté de 128M à 256M pour traiter les images)
memory_limit = 256M

; Temps d'exécution maximum (augmenté de 30 à 300 secondes pour les uploads lents)
max_execution_time = 300

; Temps maximum pour traiter les données POST (augmenté de 60 à 300 secondes)
max_input_time = 300

; Nombre maximum de variables d'entrée (conservé)
max_input_vars = 1000

; Affichage des erreurs (conservé)
display_errors = On

; Compression de sortie (conservé)
zlib.output_compression = On

